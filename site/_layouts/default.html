<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  {% include nav.html %}
  <main>{{ content }}</main>
  {% include footer.html %}
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var light = document.documentElement.classList.toggle('theme-light');
        try { localStorage.setItem('meic-theme', light ? 'light' : 'dark'); } catch (e) {}
      });
    })();
  </script>
  {% if page.scene %}<script type="module" src="{{ '/assets/js/lab-visuals.js' | relative_url }}"></script>{% endif %}
</body>
</html>
