---
layout: page
title: News
eyebrow: MEIC Lab
permalink: /news/
---
{% for n in site.data.news %}
<article class="news-item">
  {% if n.Cover != "" %}<div class="news-cover"><img src="{{ n.Cover | relative_url }}" alt="{{ n.Summary }}" loading="lazy"></div>{% endif %}
  <div class="news-body">
    <p class="news-date">{{ n.Date }}{% if n.Type != "" %} · {{ n.Type }}{% endif %}</p>
    <p class="news-title">{{ n.Summary }}</p>
    <p class="news-text">{{ n.Content }}</p>
  </div>
</article>
{% endfor %}
