<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">MEIC</span>
      <span class="brand-sub">Laboratory</span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">

    <nav class="site-nav">
      <ul class="nav-root">
        {% for item in site.data.nav %}
        <li class="nav-item{% if item.children %} has-children{% endif %}">
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
          {% if item.children %}
          <ul class="nav-sub">
            {% for c in item.children %}
            <li><a href="{{ c.url | relative_url }}">{{ c.title }}</a></li>
            {% endfor %}
          </ul>
          {% endif %}
        </li>
        {% endfor %}
      </ul>
    </nav>

    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light / dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <label for="nav-toggle" class="nav-burger" aria-label="menu"><span></span><span></span><span></span></label>
    </div>
  </div>
</header>
